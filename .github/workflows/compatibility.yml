name: Compatibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
            audit: false
          - os: ubuntu-latest
            python: "3.14"
            audit: true
          - os: windows-latest
            python: "3.13"
            audit: false
          - os: macos-latest
            python: "3.13"
            audit: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install base and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Verify local-model binary resolution
        run: >-
          python -m pip install --dry-run --no-deps --only-binary=:all:
          "huggingface-hub>=0.27,<2"
          "sentence-transformers>=3.4,<7"
          "torch>=2.5"
          "transformers>=4.48,<6"
      - name: Lint
        run: python -m ruff check src tests
      - name: Test
        run: python -m pytest -q
      - name: Audit installed dependencies
        if: matrix.audit
        run: python -m pip install pip-audit && python -m pip_audit --local --skip-editable

  container:
    name: SignalRoom container build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build primary image
        run: docker build --tag signalroom-ci .
